<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-box-shadow</title>
    <link rel="stylesheet" href="../src/css/Styles.css">
    <style>
        section {
            div.box {
                border: 2px solid #fff9;
                height: 140px;
                margin: 0 auto;
                width: 240px;
                &.box1 {
                    box-shadow: 0 0 12px #fff;
                }
                &.box2 {
                    box-shadow: -10px -10px 24px 0 #fff;
                }
                &.box3 {
                    box-shadow: 0 0 20px #fff inset;
                }
                &.box4 {
                    border: 4px solid #0009;
                    border-radius: 50%;
                    height: 140px;
                    width: 140px;
                    box-shadow: 10px 10px 0px 10px #ff0,
                                10px 10px 5px 10px #00f,
                                20px 20px 5px 10px #f00;

                }
        }
        div.images {
            img {
                width: 180px;
                &:first-child {
                    box-shadow: 0 0 12px #fff;
                }
                &:last-child {
                    filter: drop-shadow(0 0 12px #fff);
                }
            }
        }
    }
    </style>
</head>
<body class="css">

        </a>
    </nav>
    <main>
            <header class="mainmenu submenu">
            <h1>27-box-shadow</h1>
            <img src="../src/img/logo-css.png" alt="css">
            <h3>Property attaches one or more shadows to an element.</h3>
            </header>
                    <section>
            <h2 class="subtitle">box-shadow: 0 0 12px #fff</h2>
            <div class="box box1"></div>
            <h2 class="subtitle">box-shadow: -10px -10px 24px 0 #fff</h2>
            <div class="box box2"></div>
            <h2 class="subtitle">box-shadow: 0 0 20px #fff inset</h2>
            <div class="box box3"></div>
            <h2 class="subtitle">box-shadow: multiple</h2>
            <div class="box box4"></div>
            <h2 class="subtitle">box-shadow VS drop-shadow()</h2>
            <div class="images">
                <img src="imgs/mario.png">
                <img src="imgs/mario.png">
            </div>
        </section>
    </main>
