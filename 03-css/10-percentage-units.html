<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-percentage-units</title>
    <link rel="stylesheet" href="../src/css/Styles.css">
    <style>
        main {
            width: 100%;
            section.percentage {
                margin: 0 auto;
                width: 80%;
                div.parent {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    div {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: auto 50VH;
                        font-size: 3rem;
                        &.child1 {
                            background-color: palegreen;
                            width: 70%;
                        }
                        &.child2 {
                            background-color: darkorchid;
                            width: 30%;
                        }
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z"></path></svg>
        </a>
    </nav>
    <main>
            <header class="mainmenu submenu">
            <h1>10-percentage-units </h1>
            <img src="../src/img/logo-css.png" alt="Css">
            <h3>Are relative to the size of the parent element.</h3>
            </header>
            <section class="percentage">
                <h2 class="subtitle">Example:</h2>
                <div class="parent">
                    <div class="child1">70%</div>
                    <div class="child2">30%</div>
            </section>
    </main>
</body>
</html>
