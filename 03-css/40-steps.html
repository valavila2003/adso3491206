<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-steps</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        :root {
            --size: 256px;
        }
        body{
            overflow: hidden;
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png)
                             no-repeat center / cover;
                border-radius: 12px;
                corner-shape: squircle;
                position: relative;
                outline: 4px solid #fff;
                height: 430px;

                div.info{
                    background-color: #0009;
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    font-size: 1.5rem;
                    text-align: center;
                    position: absolute;
                    top: 0.8rem;
                    left: 0.8rem;
                    padding: 0.4rem;
                    width: 340px;
                }

                div#trainer {
                    background: url(imgs/steps-all.png)
                                no-repeat;
                    border-radius: 12px;
                    transform: scale(.8);
                    position: absolute;
                    bottom: 0;
                    left: 4rem;
                    height: var(--size);
                    width: var(--size);

                    animation: 0.8s animTrainer steps(4) infinite;

                    &.front { background-position-y: calc(var(--size) * 0); }
                    &.left { background-position-y: calc(var(--size) * -1); }
                    &.right { background-position-y: calc(var(--size) * -2); }
                    &.back { background-position-y: calc(var(--size) * -3); }
                }
            }
        }
        @keyframes animTrainer {
            100% {background-position-x: -1024px ;}
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z"></path></svg>
        </a>
    </nav>
    <main>
            <header class="mainmenu submenu">
            <h1>40-steps</h1>
            <img src="../src/img/logo-css.png" alt="css">
            <h3>Allows step-by-step animation of a sprite</h3>
            </header>
            <section>
            <h2 class="subtitle">Example: </h2>
            <div class="bg">
                <div class="info">
                    Please press arrow keys: <br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div id="trainer" class="front"></div>
            </div>
            </section>
    </main>
    <script>
        const trainer = document.getElementById('trainer');
        document.addEventListener('keyup', function(e){
            //console.log(e.keyCode);
            switch (e.keyCode) {
                case 37: //Left
                    trainer.className  = ' ';
                    trainer.classList.add('left');                    
                    break;
                case 38: //Up
                    trainer.className  = ' ';
                    trainer.classList.add('back');                    
                    break;
                case 39: //Right
                    trainer.className  = ' ';
                    trainer.classList.add('right');                    
                    break;
                case 40: //Down
                    trainer.className  = ' ';
                    trainer.classList.add('front');                    
                    break;
            }
        })
    </script>
</body>
</html>
